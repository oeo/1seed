[package]
name = "oneseed"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "Deterministic cryptographic keys from a single seed"
repository = "https://github.com/oeo/1seed"
keywords = ["cryptography", "age", "ssh", "keys", "deterministic"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "1seed"
path = "src/main.rs"

[[bin]]
name = "1seed-generate"
path = "src/generate.rs"
required-features = ["generate"]

[dependencies]
# KDF
scrypt = "0.11"
hkdf = "0.12"
sha2 = "0.10"

# Crypto primitives
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
zeroize = { version = "1.7", features = ["derive"] }

# Key formats
age = { version = "0.10", features = ["armor"] }
ssh-key = { version = "0.6", features = ["ed25519"] }
bip39 = "2.0"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }
clap_mangen = { version = "0.2", optional = true }
clap_complete = { version = "4.4", optional = true }
rpassword = "7.3"

# Utilities
base64 = "0.21"
hex = "0.4"
bech32 = "0.9"
dirs = "5.0"

# Secure storage
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }

[features]
generate = ["dep:clap_mangen", "dep:clap_complete"]

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = true
strip = true
